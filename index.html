.globe-stage canvas:active{cursor:grabbing}
.globe-marker{position:absolute;width:20px;height:20px;transform:translate(-50%,-50%);border:0;background:transparent;cursor:pointer;border-radius:50%;z-index:2}
.globe-label{display:none}
.globe-place{position:absolute;left:50%;bottom:1.5%;transform:translateX(-50%);font-size:15px;white-space:nowrap;background:rgba(255,255,255,.92);padding:5px 9px;border:1px solid #dededb;border-radius:999px;z-index:5}
